<!doctype html><meta charset="utf-8"><title>相机开场本机验证</title>
<style>body{font:13px Arial,sans-serif;margin:16px;background:#eee;color:#111}button{padding:8px 14px;margin-right:8px}iframe{display:block;width:1100px;max-width:100%;height:660px;border:1px solid #ccc;margin:14px auto}#result{white-space:pre-wrap;line-height:1.7}</style>
<button id="run">运行开场验证</button><button id="desktop">浅色电脑预览</button><button id="phone">深色手机预览</button><div id="result">仅使用本机合成照片，不修改线上账号或照片。</div><iframe id="site" title="照片集开场预览"></iframe>
<button id="mid">检查镜头穿越中段</button><button id="end">检查揭示完成前</button>
<script>
const frame=document.querySelector('#site'),result=document.querySelector('#result');let turn=0;
const wait=async test=>{for(let i=0;i<180;i++){if(test())return;await new Promise(r=>setTimeout(r,50));}throw Error('等待状态超时');};
const check=(yes,message)=>{if(!yes)throw Error(message);};
async function load({fresh=true,theme='light',width=1100,notice=true}={}){if(fresh)sessionStorage.removeItem('class7-camera-entered');if(notice)localStorage.removeItem('class7-usage-notice-seen');else localStorage.setItem('class7-usage-notice-seen','1');localStorage.setItem('class7-theme',theme);frame.style.width=width+'px';await new Promise(resolve=>{frame.onload=resolve;frame.src='/album/?camera-qa='+ ++turn;});return frame.contentDocument;}
document.querySelector('#desktop').onclick=()=>load({notice:false});document.querySelector('#phone').onclick=()=>load({theme:'dark',width:390,notice:false});
async function checkCanvasFallback(w){const box=w.document.createElement('div');box.hidden=true;const a=w.document.createElement('canvas'),b=w.document.createElement('canvas');a.width=a.height=240;b.width=320;b.height=200;box.append(a,b);w.document.body.append(box);const originalWorker=w.Worker;let renderer;try{w.Worker=class{constructor(){throw Error('simulated blocked worker');}};renderer=w.createCameraIrisRenderer(a,b,{width:320,height:200,scale:.3,end:3});check(box.querySelector('canvas').dataset.renderer==='main-thread','Worker不可用时降级');renderer.start(30);await new Promise(r=>setTimeout(r,50));await renderer.finish();return true;}finally{w.Worker=originalWorker;renderer?.destroy();box.remove();}}
function checkOpaqueIris(w){const c=w.document.createElement('canvas');c.width=c.height=656;const draw=w.cameraIrisPainter(c),ctx=c.getContext('2d');let checked=0;for(const p of [0,.25,.5,.65]){draw(p);const data=ctx.getImageData(0,0,656,656).data;for(let a=0;a<360;a+=3){const r=p===0?60:75,x=Math.round(328+(656/240)*r*Math.cos(a*Math.PI/180)),y=Math.round(328+(656/240)*r*Math.sin(a*Math.PI/180));check(data[(y*656+x)*4+3]===255,'叶片金属不透明 p='+p+' a='+a);checked++;}if(p>=.5)check(data[(328*656+328)*4+3]===0,'中心真实开口透明');}let seamSamples=0;for(const p of [0,.25,.5,.65,.8]){draw(p);const data=ctx.getImageData(0,0,656,656).data;for(let a=0;a<360;a++){let metalStart=null;for(let r=0;r<80;r+=.5){const x=Math.round(328+(656/240)*r*Math.cos(a*Math.PI/180)),y=Math.round(328+(656/240)*r*Math.sin(a*Math.PI/180)),alpha=data[(y*656+x)*4+3];if(alpha===255&&metalStart===null)metalStart=r;if(metalStart!==null&&r>metalStart+2){check(alpha===255,'接缝漏光 p='+p+' angle='+a+' radius='+r);seamSamples++;}}}}draw(1);check(ctx.getImageData(0,0,656,656).data.every(v=>v===0),'终点完全清空');return {opaqueSamples:checked,seamSamples,passed:true};}
async function sample(ms){const d=await load({notice:false});await wait(()=>d.querySelector('#camera-intro').matches(':modal'));await wait(()=>[...d.querySelectorAll('#photo-wall img')].some(img=>img.complete&&img.naturalWidth>0));d.querySelector('#camera-shutter').click();frame.contentWindow.eval('clearTimeout(cameraIntroTimer)');frame.contentWindow.eval('cameraIrisRenderer.destroy()');const old=d.querySelector('#camera-iris-canvas'),canvas=d.createElement('canvas');canvas.id=old.id;canvas.width=canvas.height=768;old.replaceWith(canvas);frame.contentWindow.cameraIrisPainter(canvas)(ms/3200);const oldMatte=d.querySelector('#camera-matte-canvas'),matte=d.createElement('canvas');matte.id=oldMatte.id;matte.width=oldMatte.width;matte.height=oldMatte.height;oldMatte.replaceWith(matte);const g=frame.contentWindow.eval('cameraGeometry');frame.contentWindow.cameraMattePainter(matte,g)(ms/3200);for(const a of d.getAnimations()){a.pause();a.currentTime=Math.min(ms,a.effect.getTiming().duration);}result.textContent='固定时间点 '+ms+'ms · 原首页从六片叶片之间直接显现';}
document.querySelector('#mid').onclick=()=>sample(2000);document.querySelector('#end').onclick=()=>sample(2900);
document.querySelector('#run').onclick=async()=>{try{
 let d=await load();await wait(()=>d.querySelector('#camera-intro')?.matches(':modal'));check(!d.querySelector('#info-dialog').open,'开场不叠加使用须知');check(d.activeElement.id==='camera-shutter','焦点落在可操作快门');await wait(()=>[...d.querySelectorAll('#photo-wall img')].some(img=>img.complete&&img.naturalWidth>0));
 const alphaChecks=checkOpaqueIris(frame.contentWindow);const canvasFallback=await checkCanvasFallback(frame.contentWindow);const rendererMode=d.querySelector('#camera-iris-canvas').dataset.renderer;const idle=[];await new Promise(resolve=>{const start=performance.now();const record=t=>{idle.push(t);if(performance.now()-start<650)frame.contentWindow.requestAnimationFrame(record);else resolve();};frame.contentWindow.requestAnimationFrame(record);});const idleIntervals=idle.slice(1).map((t,i)=>t-idle[i]).sort((a,b)=>a-b);const idleMedianMs=idleIntervals[Math.floor(idleIntervals.length/2)];const visibleAtStart=d.visibilityState;const stamps=[];let sampling=true;const record=t=>{stamps.push(t);if(sampling)frame.contentWindow.requestAnimationFrame(record);};frame.contentWindow.requestAnimationFrame(record);const main=d.querySelector('main'),photo=d.querySelector('#photo-wall img'),pageWidth=main.getBoundingClientRect().width;d.querySelector('#camera-shutter').click();d.querySelector('#camera-shutter').click();await wait(()=>!d.querySelector('#camera-intro').open&&d.querySelector('#info-dialog').open);sampling=false;const workerDrawStats=JSON.parse(d.querySelector('#camera-iris-canvas')?.dataset.drawStats||'null');const intervals=stamps.slice(1).map((t,i)=>t-stamps[i]),ordered=[...intervals].sort((a,b)=>a-b);const timing={visibleAtStart,visibleAtEnd:d.visibilityState,samples:intervals.length,benchmarkValid:visibleAtStart==='visible'&&d.visibilityState==='visible'&&intervals.length>60,medianMs:ordered[Math.floor(ordered.length/2)],p95Ms:ordered[Math.floor(ordered.length*.95)],over25Ms:intervals.filter(n=>n>25).length,over50Ms:intervals.filter(n=>n>50).length,maxMs:Math.max(...intervals)};check(Math.abs(main.getBoundingClientRect().width-pageWidth)<1,'没有滚动条布局跳动');check(d.querySelector('main')===main&&d.querySelector('#photo-wall img')===photo,'实际首页节点始终保留');check(d.documentElement.dataset.cameraIntro==='done','动画结束清理');check(sessionStorage.getItem('class7-camera-entered')==='1','记录同标签页已进入');d.querySelector('[data-close-dialog="info-dialog"]').click();
 d=await load({fresh:false,notice:false});check(!d.querySelector('#camera-intro').open,'刷新不重播');check(!d.querySelector('#info-dialog').open,'使用须知不重复');
 d=await load({theme:'dark',width:390,notice:false});await wait(()=>d.querySelector('#camera-intro').matches(':modal'));check(!!d.querySelector('#camera-matte-canvas'),'深色模式使用独立背景画布');check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,'手机无横向溢出');const box=d.querySelector('#camera-shutter').getBoundingClientRect();check(box.width>=44&&box.height>=44,'手机快门点击范围');d.querySelector('#camera-intro-skip').click();await wait(()=>!d.querySelector('#camera-intro').open);check(d.activeElement.classList.contains('brand'),'退出后焦点回到网页');
 d=await load({notice:false});await wait(()=>d.querySelector('#camera-intro').matches(':modal'));d.querySelector('#camera-intro').dispatchEvent(new Event('cancel',{cancelable:true}));await wait(()=>!d.querySelector('#camera-intro').open);
 const report={canvasFallback,alphaChecks,rendererMode,idleMedianMs,workerDrawStats,checkedAt:new Date().toISOString(),localSyntheticOnly:true,appVersion:d.querySelector('script[src*="app.js"]')?.src,roundedReferenceCamera:true,smoothHexAperture:true,curvedOverlappingBlades:true,circularOverlapReturn:true,rotatingSixBladeLayers:true,mainThreadRafTiming:timing,noScrollbarLayoutJump:true,realPageNodesPreserved:true,sixBladePortal:true,nativeModalAndFocus:true,photosPreloadBehindIntro:true,shutterToNoticeThenAlbum:true,repeatedClickSafe:true,refreshDoesNotReplay:true,noticeShownOnce:true,darkTheme:true,mobile390NoOverflow:true,mobileShutterHitTarget44:true,skipAndEscape:true,focusRestored:true,passed:true};await fetch('/__qa/camera-report',{method:'POST',body:JSON.stringify(report)});result.textContent='PASS · 六片叶片 / 无布局跳变 / 完整入口流程。帧回调：'+JSON.stringify(timing);await load({theme:'dark',width:390,notice:false});
 }catch(e){result.textContent='FAIL · '+e.message;}};
</script>
