<!doctype html><meta charset="utf-8"><title>签到积分验证</title><style>body{font:14px Arial}iframe{width:1100px;height:820px;border:1px solid #aaa}pre{white-space:pre-wrap}</style><script>localStorage.setItem('class7-photo-order','random');localStorage.setItem('class7-usage-notice-seen','1');</script><button id="run">运行签到检查</button><pre id="result">尚未运行</pre><iframe id="site" src="/album/"></iframe><script>
const result=document.querySelector('#result'),frame=document.querySelector('#site');const wait=async test=>{for(let i=0;i<150;i++){if(test())return;await new Promise(r=>setTimeout(r,60));}throw Error('等待状态超时');};const check=(v,m)=>{if(!v)throw Error(m);};
document.querySelector('#run').onclick=async()=>{try{await fetch('/__qa/points-reset',{method:'POST'});await new Promise(resolve=>{frame.onload=resolve;frame.src='/album/?qa='+Date.now();});const d=frame.contentWindow.document;await wait(()=>d.querySelector('#profile-button')?.textContent.includes('合成测试'));const button=d.querySelector('#checkin-button');check(button&&!button.disabled,'已登录可签到');button.click();await wait(()=>button.disabled&&d.querySelector('#checkin-label').textContent.includes('已签到'));check(d.querySelector('#points-badge').textContent==='10','积分即时显示10');check(d.querySelector('#points-badge').hidden===false,'徽标显示');d.querySelector('#comment-contest-nav').click();await wait(()=>d.body.classList.contains('comment-board-mode'));check(button.disabled,'切栏目不会重置签到');d.querySelector('#profile-button').click();await wait(()=>d.querySelector('#login-dialog').open);d.querySelector('#account-logout').click();await wait(()=>d.querySelector('#profile-button').textContent.includes('登录')&&!d.querySelector('#login-dialog').open);check(!button.disabled&&d.querySelector('#points-badge').hidden,'退出清空积分状态');button.click();await wait(()=>d.querySelector('#login-dialog').open);await fetch('/api/account/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'local_test',password:'synthetic-only'})});frame.contentWindow.location.reload();result.textContent='PASS：签到按钮、即时积分、已签禁用、栏目切换、退出清空、未登录进入登录窗口。';}catch(e){result.textContent='FAIL：'+e.message;}};
</script>
