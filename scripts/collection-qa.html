<!doctype html><meta charset="utf-8"><title>卡牌与成就本机验证</title><style>body{font:14px Arial}iframe{width:1100px;height:820px;border:1px solid #aaa}pre{white-space:pre-wrap}</style><script>sessionStorage.setItem('class7-camera-entered','1');localStorage.setItem('class7-photo-order','random');localStorage.setItem('class7-usage-notice-seen','1');</script><button id="run">运行收藏检查</button><pre id="result">本机合成数据，不是真实账号库存。</pre><iframe id="site" src="/album/"></iframe><script>
const result=document.querySelector('#result'),frame=document.querySelector('#site');const wait=async test=>{for(let i=0;i<180;i++){if(test())return;await new Promise(r=>setTimeout(r,60));}throw Error('等待状态超时');};const check=(v,m)=>{if(!v)throw Error(m);};const fixture=count=>fetch('/__qa/collection-fixture',{method:'POST',body:JSON.stringify({count})});
const pointer=(d,card,type='mouse')=>{const r=card.getBoundingClientRect();card.dispatchEvent(new frame.contentWindow.PointerEvent('pointermove',{bubbles:true,pointerType:type,clientX:r.left+r.width*.8,clientY:r.top+r.height*.2}));};
document.querySelector('#run').onclick=async()=>{try{await fixture(19);const d=frame.contentWindow.document;await wait(()=>d.querySelector('#profile-button')?.textContent.includes('合成测试'));d.querySelector('#mall-nav').click();await wait(()=>d.querySelectorAll('.mall-card').length===5&&!d.querySelector('#mall-status').textContent);check([...d.querySelectorAll('.mall-redeem')].map(x=>x.textContent).join('|')==='收藏 · 10 积分|收藏 · 20 积分|收藏 · 30 积分|收藏 · 10 积分|收藏 · 20 积分','分级价格显示');const card=d.querySelector('.mall-card');check(frame.contentWindow.matchMedia('(hover:hover) and (pointer:fine)').matches,'桌面测试应有鼠标');pointer(d,card);await wait(()=>card.style.getPropertyValue('--card-rx'));check(card.classList.contains('is-hovered'),'桌面卡牌启用倾斜');check(Math.abs(parseFloat(card.style.getPropertyValue('--card-rx')))<=6&&d.querySelectorAll('.mall-card.is-hovered').length===1,'倾斜受限且只更新一张');d.querySelector('#mall-items').dispatchEvent(new frame.contentWindow.PointerEvent('pointerleave'));check(!card.classList.contains('is-hovered'),'移开恢复');
 for(const [count,title] of [[19,'新手收藏者'],[39,'老手收藏家'],[59,'大份收集家']]){await fixture(count);d.querySelector('#mall-shop-tab').click();await wait(()=>d.querySelector('#mall-inventory-count').textContent===String(count)&&!d.querySelector('#mall-status').textContent);const buy=d.querySelector('.mall-redeem');buy.click();buy.click();await wait(()=>d.querySelector('#mall-inventory-count').textContent===String(count+1));await wait(()=>d.querySelector('#toast').textContent.includes('解锁收藏成就：'+title));d.querySelector('#mall-inventory-tab').click();await wait(()=>!d.querySelector('#mall-collection-progress').hidden&&d.querySelector('#collection-total').textContent===String(count+1));check(d.querySelector('#collection-current-title').textContent===title,'称号阈值：'+title);check(d.querySelectorAll('.collection-achievements .is-unlocked').length===(count+1)/20,'成就逐级保留');}
 await fixture(65);d.querySelector('#mall-inventory-tab').click();await wait(()=>d.querySelector('#collection-total').textContent==='65'&&!d.querySelector('#mall-status').textContent);check(d.querySelectorAll('.mall-card').length===20,'库存仍只加载第一页');check(d.querySelectorAll('.collection-tier').length===3&&d.querySelector('#collection-next').textContent.includes('全部解锁'),'超过60张的完整进度');d.querySelector('#mall-more').click();await wait(()=>d.querySelectorAll('.mall-card').length===40);check(d.querySelector('#collection-total').textContent==='65','分页不重复计数');
 frame.style.width='390px';await new Promise(r=>setTimeout(r,100));const mobile=d.querySelector('.mall-card');pointer(d,mobile);await new Promise(r=>setTimeout(r,30));check(!mobile.classList.contains('is-hovered')&&frame.contentWindow.getComputedStyle(mobile).transform==='none','手机完全不启用3D效果');check(frame.contentWindow.getComputedStyle(d.querySelector('#mall-items')).gridTemplateColumns.split(' ').length===2,'手机版保持两列');check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,'手机无横向溢出');
 frame.style.width='1100px';await new Promise(r=>setTimeout(r,100));pointer(d,d.querySelector('.mall-card'),'touch');check(!d.querySelector('.mall-card').classList.contains('is-hovered'),'触摸不启用效果');d.querySelector('#profile-button').click();await wait(()=>d.querySelector('#login-dialog').open);d.querySelector('#account-logout').click();await wait(()=>d.querySelector('#profile-button').textContent.includes('登录'));check(d.querySelector('#mall-collection-progress').hidden,'退出隐藏私人进度');
 const report={checkedAt:new Date().toISOString(),localSyntheticOnly:true,tierPriceButtons10_20_30:true,desktopTiltAndSingleCard:true,leaveResets:true,purchaseMilestones20_40_60:true,exactTitles:true,progressUsesServerTotal65NotPage20:true,paginationDoesNotInflateProgress:true,mobileNoTilt:true,mobileTwoColumnsPreserved:true,mobileNoOverflow:true,touchDisabled:true,logoutClearsProgress:true,passed:true};await fixture(60);await new Promise(resolve=>{frame.onload=resolve;frame.src='/album/?preview='+Date.now();});const preview=frame.contentWindow.document;await wait(()=>preview.querySelector('#profile-button')?.textContent.includes('合成测试'));preview.querySelector('#mall-nav').click();await wait(()=>preview.querySelectorAll('.mall-card').length===5);preview.querySelector('#mall-inventory-tab').click();await wait(()=>preview.querySelector('#collection-total').textContent==='60'&&preview.querySelector('.mall-card')&&!preview.querySelector('#mall-status').textContent);pointer(preview,preview.querySelector('.mall-card'));await fetch('/__qa/collection-report',{method:'POST',body:JSON.stringify(report)});result.textContent='PASS · 桌面动效、收藏成就和手机版兼容验证通过。本机合成数据预览。';}catch(e){result.textContent='FAIL '+e.message;}};
</script>
