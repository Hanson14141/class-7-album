<!doctype html><meta charset="utf-8"><title>评论榜验证</title><style>body{font:14px Arial}iframe{width:1100px;height:820px;border:1px solid #aaa}pre{white-space:pre-wrap}</style><script>localStorage.setItem('class7-photo-order','random');localStorage.setItem('class7-usage-notice-seen','1');</script><button id="run">运行评论榜检查</button><pre id="result">尚未运行</pre><iframe id="site" src="/album/"></iframe><script>
const result=document.querySelector('#result'),frame=document.querySelector('#site');const wait=async test=>{for(let i=0;i<150;i++){if(test())return;await new Promise(r=>setTimeout(r,60));}throw Error('等待页面状态超时');};const check=(v,m)=>{if(!v)throw Error(m);};
document.querySelector('#run').onclick=async()=>{try{const w=frame.contentWindow,d=w.document;await wait(()=>d.querySelector('#comment-contest-nav')&&d.querySelectorAll('.photo-card').length);const before=await(await fetch('/__qa/comments')).json();check(!before.requests.some(x=>x.type==='board'),'主照片墙不得提前请求评论榜');d.querySelector('#comment-contest-nav').click();await wait(()=>d.querySelectorAll('[data-comment-entry]').length===50);check(d.querySelectorAll('#comment-board-podium [data-comment-entry]').length===3,'前三名应唯一');check(d.querySelectorAll('#comment-board-list [data-comment-entry]').length===47,'下方应从第四名开始');check(d.querySelector('#comment-contest-nav').getAttribute('aria-current')==='page','导航激活');check(w.getComputedStyle(d.querySelector('.gallery-section')).display==='none','照片墙隐藏');check(d.querySelectorAll('.comment-board-source').length===50,'所有评论标出照片来源');const first=d.querySelector('#comment-board-podium [data-comment-entry]'),id=first.dataset.commentEntry;check(id==='qa-comment-0','本周优胜应来自第一条旧评论');const like=first.querySelector('[data-comment-like-id]'),count=like.textContent;like.click();await wait(()=>!like.disabled&&like.getAttribute('aria-pressed')==='true');check(first.dataset.commentEntry===id,'点赞不重排');like.click();await wait(()=>!like.disabled&&like.getAttribute('aria-pressed')==='false');check(like.textContent===count,'取消恢复总赞');d.querySelector('#more-comment-board').click();await wait(()=>d.querySelectorAll('[data-comment-entry]').length===80);check(new Set([...d.querySelectorAll('[data-comment-entry]')].map(x=>x.dataset.commentEntry)).size===80,'分页不能重复');first.querySelector('.comment-board-source').click();await wait(()=>d.querySelector('#lightbox').open&&d.querySelector('#comment-qa-comment-0'));check(d.querySelector('#comment-qa-comment-0').classList.contains('comment-focused'),'旧评论准确定位');d.querySelector('#lightbox [aria-label="关闭大图"]').click();d.querySelector('[data-comment-period="total"]').click();await wait(()=>d.querySelector('#comment-board-podium [data-comment-entry]')?.dataset.commentEntry==='qa-comment-79');check(d.querySelector('#comment-board-title').textContent==='评论总赞榜','累计榜标题');d.querySelector('[data-comment-period="previous"]').click();await wait(()=>d.querySelector('#comment-board-dates').textContent.includes('已结算'));check(!d.querySelector('#comment-board-podium .comment-board-vote'),'历史榜不混入本周投票按钮');d.querySelector('.nav-tab[data-view="all"]').click();await wait(()=>!d.body.classList.contains('comment-board-mode'));d.querySelector('#weekly-contest-nav').click();await wait(()=>d.querySelector('#weekly-contest-nav').classList.contains('active'));check(!d.querySelector('#comment-contest-nav').classList.contains('active'),'返回每周大赛导航正确');result.textContent='PASS：按需加载、前三名、照片来源、80条分页、点赞不重排、旧评论定位、总榜/上周、导航返回。';}catch(e){result.textContent='FAIL：'+e.message;}};
</script>
