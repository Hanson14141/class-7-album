<!doctype html><meta charset="utf-8"><title>库存表情本机验证</title><style>body{font:14px Arial}iframe{width:1100px;height:820px;border:1px solid #aaa}pre{white-space:pre-wrap}</style><script>localStorage.setItem('class7-photo-order','random');localStorage.setItem('class7-usage-notice-seen','1');</script><button id="run">运行库存表情检查</button><pre id="result">尚未运行</pre><iframe id="site" src="/album/"></iframe><script>
const result=document.querySelector('#result'),frame=document.querySelector('#site');const wait=async test=>{for(let i=0;i<180;i++){if(test())return;await new Promise(r=>setTimeout(r,60));}throw Error('等待状态超时');};const check=(v,m)=>{if(!v)throw Error(m);};
document.querySelector('#run').onclick=async()=>{try{const d=frame.contentWindow.document;await wait(()=>d.querySelector('#profile-button')?.textContent.includes('合成测试')&&d.querySelector('#photo-wall button'));check((await(await fetch('/__qa/mall-report')).json()).inventoryCalls===0,'照片墙不预先读取库存');d.querySelector('#photo-wall button').click();await wait(()=>d.querySelector('#lightbox').open);d.querySelector('#comment-emoji-toggle').click();await wait(()=>d.querySelectorAll('.comment-emoji-choice').length===1);d.querySelector('.comment-emoji-choice').click();check(!d.querySelector('#comment-emoji-selected').hidden&&!d.querySelector('#comment-body').required,'可单独发照片表情');d.querySelector('#comment-form').requestSubmit();await wait(()=>d.querySelector('#comment-list .comment-photo-emoji'));await wait(()=>d.querySelector('#comment-emoji-selected').hidden);check(d.querySelector('#comment-body').required,'发送成功清空表情');const emoji=d.querySelector('#comment-list .comment-photo-emoji');emoji.click();await wait(()=>d.querySelector('#mall-photo-dialog').open);check(d.querySelector('#mall-photo-title').textContent.includes('本机合成测试'),'表情可放大');d.querySelector('#mall-photo-close').click();const comment=emoji.closest('.comment');[...comment.querySelectorAll('button')].find(b=>b.textContent==='回复').click();d.querySelector('#comment-body').value='带文字的照片表情回复';d.querySelector('#comment-emoji-toggle').click();await wait(()=>d.querySelector('.comment-emoji-choice'));d.querySelector('.comment-emoji-choice').click();d.querySelector('#comment-form').requestSubmit();await wait(()=>d.querySelectorAll('#comment-list .comment-photo-emoji').length===2);const requests=(await(await fetch('/__qa/comments')).json()).requests.filter(x=>x.type==='posted');check(requests.length===2&&requests[0].body===''&&requests[1].replyToId&&requests.every(x=>x.emojiInventoryId),'表情、文字和回复一起提交');frame.style.width='390px';await new Promise(r=>setTimeout(r,100));check(d.querySelector('.comment-photo-emoji').getBoundingClientRect().width<=80,'手机表情保持小尺寸');check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,'手机无横向溢出');d.querySelector('#comment-emoji-toggle').click();await wait(()=>d.querySelector('.comment-emoji-choice'));d.querySelector('.comment-emoji-choice').click();d.querySelector('#lightbox [data-close-dialog="lightbox"]').click();d.querySelector('#profile-button').click();await wait(()=>d.querySelector('#login-dialog').open);d.querySelector('#account-logout').click();await wait(()=>d.querySelector('#profile-button').textContent.includes('登录'));check(d.querySelector('#comment-emoji-selected').hidden&&d.querySelector('#comment-emoji-picker').hidden,'退出清空选中表情和私人选择器');const report={checkedAt:new Date().toISOString(),localSyntheticOnly:true,onDemandInventory:true,imageOnlyComment:true,textAndEmojiReply:true,thumbnailAndZoom:true,mobileCompact:true,mobileNoOverflow:true,draftClearedAfterSend:true,privatePickerClearedAfterLogout:true,passed:true};await fetch('/__qa/emoji-report',{method:'POST',body:JSON.stringify(report)});result.textContent='PASS '+JSON.stringify(report);}catch(e){result.textContent='FAIL '+e.message;}};
</script>
