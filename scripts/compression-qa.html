<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片压缩本地验证</title><style>body{font:14px Arial,"Microsoft YaHei",sans-serif;margin:22px;color:#111}button{padding:12px 18px;margin:8px 12px 8px 0;background:#111;color:white;border:0;cursor:pointer}pre{white-space:pre-wrap;background:#f3f3f3;padding:14px}iframe{width:100%;height:780px;border:1px solid #bbb}a{margin-right:15px}</style><h1>照片压缩本地验证</h1><p>只生成合成测试图，不读取电脑照片。下方相册的上传保存在本地测试目录，不会传到线上。</p><button id="run">运行真实浏览器压缩验证</button><button id="select" disabled>将三张合成图片放入上传窗口</button><button id="check" disabled>检查上传结果</button><pre id="status">尚未运行</pre><div id="downloads"></div><iframe id="album" title="本地相册验证" src="/album/"></iframe><script src="/assets/photo-compression.js"></script><script>
const output=document.querySelector('#status');let fixtures=[],checks=[];
const log=text=>{output.textContent+='\n'+text;};
const assert=(ok,text)=>{if(!ok)throw Error(text);checks.push(text);log('PASS '+text);};
const blob=(canvas,type,quality)=>new Promise(resolve=>canvas.toBlob(resolve,type,quality));
async function hash(file){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',await file.arrayBuffer()))].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function fixture(width,height,type,transparent=false){const c=document.createElement('canvas');c.width=width;c.height=height;const ctx=c.getContext('2d'),image=ctx.createImageData(width,height);for(let p=0;p<image.data.length;p+=65536)crypto.getRandomValues(image.data.subarray(p,Math.min(p+65536,image.data.length)));for(let p=3;p<image.data.length;p+=4)image.data[p]=transparent?128:255;if(transparent)for(let y=0;y<50;y++)for(let x=0;x<50;x++)image.data[(y*width+x)*4+3]=0;ctx.putImageData(image,0,0);const b=await blob(c,type,1);c.width=c.height=1;return new File([b],type==='image/jpeg'?'synthetic-photo.jpg':'synthetic-transparent.png',{type:b.type});}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;output.textContent='正在生成合成图片…';try{
 const smallCanvas=document.createElement('canvas');smallCanvas.width=240;smallCanvas.height=160;smallCanvas.getContext('2d').fillRect(0,0,240,160);const small=new File([await blob(smallCanvas,'image/jpeg',0.9)],'synthetic-small.jpg',{type:'image/jpeg'});
 const photo=await fixture(3000,3000,'image/jpeg'),transparent=await fixture(2048,2048,'image/png',true);fixtures=[{file:small,width:240,height:160},{file:photo,width:3000,height:3000},{file:transparent,width:2048,height:2048}];
 for(const [index,item]of fixtures.entries()){
  const before=await hash(item.file),result=await Class7PhotoCompression.prepare(item.file,item,log);item.sourceHash=before;item.result=result;
  if(index===0)assert(result.file===item.file,'小于12MB的照片保持原文件对象');else{assert(item.file.size>12000000,'测试大图 '+index+' 超过12MB');assert(result.file.size<=6000000,'测试大图 '+index+' 压缩到6MB以内');assert(await hash(item.file)===before,'测试大图 '+index+' 原文件字节未改变');}
  const decoded=await createImageBitmap(result.file);assert(decoded.width===result.width&&decoded.height===result.height,'输出尺寸与元数据一致 '+index);
  if(index===2){const c=document.createElement('canvas');c.width=c.height=1;c.getContext('2d').drawImage(decoded,0,0);assert(c.getContext('2d').getImageData(0,0,1,1).data[3]===0,'透明PNG压缩后保留透明像素');}
  decoded.close();log(item.file.name+': '+item.file.size+' → '+result.file.size+' bytes / '+result.file.type+' / '+result.width+'×'+result.height);if(index===1)assert(result.width===3000&&result.height===3000,'6MB方案保留测试JPEG的3000×3000尺寸');
 }
 let guarded=false;try{await Class7PhotoCompression.prepare(new File([new Uint8Array(12000001)],'animation.gif',{type:'image/gif'}),{width:10,height:10});}catch(e){guarded=e.message.includes('动画');}assert(guarded,'大GIF不会被静默转换成静态图片');
 document.querySelector('#select').disabled=false;document.querySelector('#check').disabled=false;log('算法验证完成。可继续在下方真实上传窗口测试旋转、说明和压缩上传。');
}catch(e){log('FAIL '+e.message);}finally{document.querySelector('#run').disabled=false;}};
document.querySelector('#select').onclick=()=>{const doc=document.querySelector('#album').contentDocument;doc.querySelector('[data-open-upload]').click();const transfer=new DataTransfer();for(const f of fixtures)transfer.items.add(f.file);const input=doc.querySelector('#photo-input');input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));log('已把三个真实 File 对象送入页面的标准文件选择 change 流程。');};
document.querySelector('#check').onclick=async()=>{try{const data=await(await fetch('/__qa/report')).json();assert(data.photos.length===3,'三张照片均通过真实页面上传');const small=data.photos.find(p=>p.width===240);assert(small?.sha256===fixtures[0].sourceHash,'小照片上传字节与原文件完全相同');assert(data.photos.every(p=>p.bytes<=6000000),'三个上传文件均在6MB以内');assert(data.photos.some(p=>p.rotation===90&&p.caption==='压缩照片独立说明'),'大照片压缩后保留单张90度旋转与独立说明');log('全部上传集成验证通过。');}catch(e){log('FAIL '+e.message);}};
</script></html>
