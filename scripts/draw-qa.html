<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽卡本机合成验证</title><style>body{font:13px Arial;margin:14px;background:#eee}button{padding:10px 16px}iframe{display:block;width:1100px;max-width:100%;height:850px;border:1px solid #aaa;margin-top:16px}pre{white-space:pre-wrap}</style><button id="run">运行抽卡界面验证</button><button id="phone">手机390px</button><pre id="result">仅使用本机合成照片，不调用线上抽卡。</pre><iframe id="site" title="抽卡预览" src="/album/"></iframe><script>
const frame=document.querySelector('#site'),out=document.querySelector('#result');const wait=async f=>{for(let i=0;i<150;i++){if(f())return;await new Promise(r=>setTimeout(r,60));}throw Error('页面状态未就绪');};const check=(v,m)=>{if(!v)throw Error(m);};document.querySelector('#phone').onclick=()=>{frame.style.width='390px';};document.querySelector('#run').onclick=async()=>{try{
 const d=frame.contentDocument;await wait(()=>d.querySelector('#draw-nav'));if(d.querySelector('#camera-intro')?.open)d.querySelector('#camera-intro-skip').click();await wait(()=>!d.querySelector('#camera-intro')?.open);if(d.querySelector('#info-dialog')?.open)d.querySelector('[data-close-dialog="info-dialog"]').click();
 d.querySelector('#draw-nav').click();await wait(()=>d.querySelector('#draw-points').textContent==='100');check(getComputedStyle(d.querySelector('.gallery-section')).display==='none','照片墙后台隐藏');check(d.querySelector('#draw-nav').getAttribute('aria-current')==='page','抽卡导航激活');d.querySelector('#draw-ten').click();d.querySelector('#draw-ten').click();await wait(()=>d.querySelectorAll('#draw-results .mall-card').length===10);check(d.querySelector('#draw-points').textContent==='10','十连扣90');check(d.querySelector('#points-badge').textContent==='10','顶栏积分同步');check(d.querySelectorAll('#draw-results [data-rarity="legendary"]').length>0&&d.querySelectorAll('#draw-results [data-rarity="classified"]').length>0,'显示稀有卡样式');
 await fetch('/__qa/draw-ambiguous');d.querySelector('#draw-single').click();await wait(()=>!d.querySelector('#draw-retry').hidden&&!d.querySelector('#draw-retry').disabled);check(d.querySelector('#draw-single').disabled&&d.querySelector('#draw-ten').disabled,'不明确响应禁止发新抽卡');d.querySelector('#draw-retry').click();await wait(()=>d.querySelector('#draw-retry').hidden&&d.querySelectorAll('#draw-results .mall-card').length===1);check(d.querySelector('#draw-points').textContent==='0','重试没有重复扣分');const report=await(await fetch('/__qa/draw-report')).json();check(report.owned===11&&report.calls===3,'重复点击与模糊响应去重');
 d.querySelector('#draw-inventory').click();await wait(()=>!d.querySelector('#mall-board').hidden&&d.querySelectorAll('#mall-items .mall-card').length===11);check(d.querySelector('#draw-board').hidden,'抽卡转库存互斥');d.querySelector('#draw-nav').click();await wait(()=>!d.querySelector('#draw-board').hidden&&d.querySelector('#draw-points').textContent==='0');frame.style.width='390px';await new Promise(r=>setTimeout(r,120));check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,'手机无横向溢出');const buttons=['draw-single','draw-ten'].map(id=>d.querySelector('#'+id).getBoundingClientRect());check(buttons.every(r=>r.height>=44&&r.left>=0&&r.right<=d.documentElement.clientWidth),'手机按钮适合点按');
 d.querySelector('#weekly-contest-nav').click();await wait(()=>d.querySelector('#draw-board').hidden);check(!d.querySelector('#draw-nav').classList.contains('active'),'切回每周大赛');d.querySelector('#draw-nav').click();await wait(()=>!d.querySelector('#draw-board').hidden);const passed={checkedAt:new Date().toISOString(),localSyntheticOnly:true,tenDraw90Points:true,headerPointsSynced:true,duplicateClicksSuppressed:true,ambiguousRetrySameRequest:true,inventoryAccessible:true,rarityStyles:true,parallelNavigation:true,mobile390NoOverflow:true,mobile44pxTargets:true,passed:true};await fetch('/__qa/draw-report',{method:'POST',body:JSON.stringify(passed)});out.textContent='PASS '+JSON.stringify(passed);
 }catch(e){out.textContent='FAIL '+e.message;}};
</script></html>
