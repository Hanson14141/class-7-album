<!doctype html><meta charset="utf-8"><title>照片商城本机验证</title><style>body{font:14px Arial}iframe{width:1100px;height:820px;border:1px solid #aaa}pre{white-space:pre-wrap}</style><script>localStorage.setItem('class7-photo-order','random');localStorage.setItem('class7-usage-notice-seen','1');</script><button id="run">运行照片商城检查</button><pre id="result">尚未运行</pre><iframe id="site" src="/album/"></iframe><script>
const result=document.querySelector('#result'),frame=document.querySelector('#site');const wait=async test=>{for(let i=0;i<180;i++){if(test())return;await new Promise(r=>setTimeout(r,60));}throw Error('等待状态超时');};const check=(v,m)=>{if(!v)throw Error(m);};
document.querySelector('#run').onclick=async()=>{try{const d=frame.contentWindow.document;await wait(()=>d.querySelector('#profile-button')?.textContent.includes('合成测试'));d.querySelector('#mall-nav').click();await wait(()=>d.querySelectorAll('.mall-card').length===5);const titles=[...d.querySelectorAll('.mall-card h3')].map(x=>x.textContent);check(d.querySelectorAll('.main-nav .active').length<=1,'栏目应只突出商城');const buy=d.querySelector('.mall-redeem');buy.click();check((await(await fetch('/__qa/mall-report')).json()).calls===0,'首次点击只确认');buy.click();buy.click();await wait(()=>d.querySelector('#mall-inventory-count').textContent==='1');check(d.querySelector('#points-badge').textContent==='90','购买后徽标减少到90');check((await(await fetch('/__qa/mall-report')).json()).calls===1,'双击只提交一次');d.querySelector('#mall-shop-tab').click();await wait(()=>d.querySelectorAll('.mall-card').length===5&&!d.querySelector('#mall-status').textContent);check(JSON.stringify([...d.querySelectorAll('.mall-card h3')].map(x=>x.textContent))===JSON.stringify(titles),'刷新不更换照片');d.querySelector('#mall-inventory-tab').click();await wait(()=>d.querySelectorAll('.mall-card').length===1);d.querySelector('.mall-picture').click();await wait(()=>d.querySelector('#mall-photo-dialog').open);check(d.querySelector('#mall-photo-title').textContent===titles[0],'库存打开原照片与说明');d.querySelector('#mall-photo-close').click();frame.style.width='390px';await new Promise(r=>setTimeout(r,100));check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,'手机无横向溢出');d.querySelector('#weekly-contest-nav').click();await wait(()=>d.querySelector('#mall-board').hidden);d.querySelector('#mall-nav').click();await wait(()=>!d.querySelector('#mall-board').hidden);d.querySelector('#profile-button').click();await wait(()=>d.querySelector('#login-dialog').open);d.querySelector('#account-logout').click();await wait(()=>d.querySelector('#profile-button').textContent.includes('登录'));await wait(()=>d.querySelectorAll('.mall-card').length===0);check(!d.querySelector('#mall-login').hidden&&d.querySelector('#points-badge').hidden,'退出清空私人库存和积分');const report={checkedAt:new Date().toISOString(),localSyntheticOnly:true,dailyFiveCards:true,confirmation:true,singleSubmit:true,pointsDecrease:true,fixedRefresh:true,inventoryOpensPhotoAndCaption:true,mobileNoOverflow:true,navReturn:true,logoutClearsPrivateInventory:true,passed:true};await fetch('/__qa/mall-report',{method:'POST',body:JSON.stringify(report)});result.textContent='PASS '+JSON.stringify(report);}catch(e){result.textContent='FAIL '+e.message;}};
</script>
