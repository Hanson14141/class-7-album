<!doctype html><meta charset="utf-8"><title>统一照片管理验证</title><style>body{font:13px Arial;margin:12px;background:#eee}button{padding:8px 12px}iframe{display:block;width:1100px;max-width:100%;height:780px;margin:12px auto;border:1px solid #aaa}</style><button id="open-manager">照片管理</button><button id="phone">手机390px</button><div id="result">仅本机37张合成照片</div><iframe id="site" title="照片管理预览"></iframe><script>
sessionStorage.setItem('class7-camera-entered','1');localStorage.setItem('class7-usage-notice-seen','1');const frame=document.querySelector('#site'),status=document.querySelector('#result');let d;
const wait=async fn=>{for(let i=0;i<160;i++){if(fn())return;await new Promise(r=>setTimeout(r,50));}throw Error('预览超时')};frame.onload=async()=>{d=frame.contentDocument;await wait(()=>d.querySelector('#vault-upload-btn')&&d.querySelector('.photo-card'));status.textContent='管理员预览就绪';};frame.src='/album/';
document.querySelector('#open-manager').onclick=async()=>{d.querySelector('#vault-upload-btn').click();await wait(()=>d.querySelector('#photo-manager').open&&d.querySelectorAll('.manager-card').length===12);status.textContent='PASS · 统一入口与首批12张按需读取';};
document.querySelector('#phone').onclick=()=>{frame.style.width='390px';requestAnimationFrame(()=>status.textContent=d.documentElement.scrollWidth<=d.documentElement.clientWidth+1?'PASS · 手机无横向溢出':'FAIL · 手机横向溢出');};
</script>
