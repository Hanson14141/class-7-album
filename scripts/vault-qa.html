<!doctype html><meta charset="utf-8"><title>保密卡与集齐成就验证</title><style>body{font:13px Arial;background:#eee;margin:12px}button{padding:8px 14px}iframe{display:block;width:1100px;max-width:100%;height:760px;border:1px solid #aaa;margin:12px auto}#result{padding:8px}</style><button id="shop">商城</button><button id="admin">管理员上传</button><button id="inventory">收藏页</button><button id="phone">手机390px</button><button id="desktop">电脑1100px</button><div id="result">仅本机合成数据</div><iframe id="site" title="卡牌预览"></iframe><script>sessionStorage.setItem('class7-camera-entered','1');localStorage.setItem('class7-usage-notice-seen','1');localStorage.setItem('class7-theme','dark');const frame=document.querySelector('#site'),result=document.querySelector('#result');const wait=async fn=>{for(let i=0;i<160;i++){if(fn())return;await new Promise(r=>setTimeout(r,50));}throw Error('预览状态超时')};let d;frame.onload=async()=>{d=frame.contentDocument;await wait(()=>d.querySelector('#profile-label')?.textContent.includes('合成测试'));d.querySelector('#mall-nav').click();await wait(()=>d.querySelectorAll('.mall-card').length===5);result.textContent='商城预览就绪';};frame.src='/album/?vault-preview=1';document.querySelector('#admin').onclick=async()=>{d.querySelector('#vault-upload-btn').click();await wait(()=>d.querySelector('#photo-manager').open);d.querySelector('#manager-upload').click();await wait(()=>d.querySelector('#upload-dialog').open);const select=d.querySelector('#admin-upload-tier');if([...select.options].map(o=>o.value).join('|')!=='epic|legendary|classified')throw Error('稀有度选项错误');select.value='classified';select.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));if(!d.querySelector('#upload-title').textContent.includes('保密级'))throw Error('标题未更新');if(!d.querySelector('#admin-upload-help').textContent.includes('购买后也不转为公开')||!d.querySelector('.preview-notice').textContent.includes('不会出现在照片墙'))throw Error('保密卡公开提示错误');result.textContent='PASS · 保密卡仅商城刷新与购买后保持隐藏提示正确';};document.querySelector('#shop').onclick=async()=>{d.querySelector('#mall-shop-tab').click();await wait(()=>d.querySelectorAll('.mall-card').length===5);result.textContent='商城预览就绪';};document.querySelector('#inventory').onclick=async()=>{await fetch('/__qa/vault-inventory',{method:'POST'});d.querySelector('#mall-inventory-tab').click();await wait(()=>d.querySelectorAll('.collection-tier').length===4&&d.querySelector('#collection-total').textContent==='12');const names=[...d.querySelectorAll('.collection-set-title')].map(n=>n.textContent);if(names.join('|')!=='超越常人的恒心|史到临头|高三七班没有活着的传奇|黑暗往事'||d.querySelectorAll('.collection-tier.is-complete').length!==4)throw Error('成就校验失败');result.textContent='PASS · 四类集齐成就名称及解锁状态正确';};document.querySelector('#phone').onclick=()=>{frame.style.width='390px';requestAnimationFrame(()=>{result.textContent=d.documentElement.scrollWidth<=d.documentElement.clientWidth+1?'PASS · 手机无横向溢出':'FAIL · 手机横向溢出';});};document.querySelector('#desktop').onclick=()=>{frame.style.width='1100px';result.textContent='电脑1100px预览';};</script>
