<dialog id="photo-manager" class="photo-manager" aria-labelledby="photo-manager-title">
 <header class="photo-manager-heading"><div><span class="eyebrow">CLASS 7 / ADMIN</span><h2 id="photo-manager-title">照片管理</h2></div><div><button type="button" class="button button-primary" id="manager-upload">上传卡牌 ＋</button><button type="button" class="icon-button" data-close-dialog="photo-manager" aria-label="关闭照片管理"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div></header>
 <p class="photo-manager-intro">为已有照片设置等级，或上传新卡牌。原照片、点赞、评论和收藏保留；保密级仅在商城刷新，不公开展示。</p>
 <form id="manager-search-form" class="manager-search-form"><label class="manager-search-label" for="manager-search">查找照片<input id="manager-search" type="search" maxlength="100" placeholder="搜索照片名或上传者" autocomplete="off"></label><label for="manager-rarity-filter">卡牌等级<select id="manager-rarity-filter"><option value="all">全部等级</option><option value="common">普通</option><option value="epic">史诗</option><option value="legendary">传奇</option><option value="classified">保密级</option></select></label><button type="submit" class="button button-secondary">查询</button><button type="button" class="text-button" id="manager-refresh">刷新</button></form>
 <div class="manager-summary"><span id="manager-count"></span><span id="manager-status" role="status" aria-live="polite"></span></div>
 <div id="manager-photos" class="manager-photos" aria-label="照片管理列表"></div><p id="manager-empty" class="manager-empty" hidden>没有找到照片，试试其他名称或等级。</p><button type="button" id="manager-more" class="text-button manager-more" hidden>加载更多照片</button>
</dialog>
